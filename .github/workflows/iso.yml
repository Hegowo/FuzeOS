name: ISO

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Construire l'ISO
        run: make iso ARCH=amd64

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="build-${GITHUB_RUN_NUMBER}"
          fi
          cd out
          sha256sum fuzeos-amd64.iso > fuzeos-amd64.iso.sha256
          if [ "$(stat -c %s fuzeos-amd64.iso)" -gt 2000000000 ]; then
            split -b 1900M -d -a 1 fuzeos-amd64.iso fuzeos-amd64.iso.part
            rm fuzeos-amd64.iso
          fi
          gh release create "$tag" ./fuzeos-amd64.iso* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "FuzeOS ${tag}" \
            --prerelease \
            --notes "ISO amd64. Si l'ISO est découpée : cat fuzeos-amd64.iso.part* > fuzeos-amd64.iso puis sha256sum -c fuzeos-amd64.iso.sha256"
