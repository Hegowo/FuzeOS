---
defaultGroups:
    - users
    - cdrom
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - bluetooth
    - lpadmin
    - scanner
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: true
passwordRequirements:
    minLength: 1
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
    shell: /bin/bash
    forbidden_names: [ root ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "fuzecorp"
    forbidden_names: [ localhost ]
presets:
    fullName:
        value: "Didier"
        editable: true
    loginName:
        value: "didier"
        editable: true
